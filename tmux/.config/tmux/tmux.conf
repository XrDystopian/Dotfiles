# ==========================
# 1. GENERAL SETTINGS
# ==========================
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set-option -g status-position bottom

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# ==========================
# 2. KEYBINDINGS
# ==========================
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Reload config
bind r source-file ~/.config/tmux/tmux.conf 

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Split windows in current path
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Vi-mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================
# 3. VISUALS & STATUS BAR
# ==========================

# Mocha Colors
thm_bg="#1e1e2e"
thm_fg="#cdd6f4"
thm_cyan="#89dceb"
thm_black="#11111b"   # Darker "Crust" color for the background
thm_gray="#313244"
thm_magenta="#cba6f7"
thm_pink="#f5c2e7"
thm_red="#f38ba8"
thm_green="#a6e3a1"
thm_yellow="#f9e2af"
thm_blue="#89b4fa"
thm_orange="#fab387"
thm_black4="#585b70"

# Status Bar General
set -g status-style "bg=${thm_bg},fg=${thm_fg}"
set -g status-justify "absolute-centre"
set -g status-left-length 100
set -g status-right-length 100

# Left Side: Session Name (Bold Magenta + Icon)
set -g status-left "#[fg=${thm_magenta},bold]  #S "

# Right Side: Empty
set -g status-right ""

# Window Styling (Squared)
# Active Window: Orange number, Gray background name
set-window-option -g window-status-current-format "#[fg=${thm_black},bg=${thm_cyan}] #I #[fg=${thm_fg},bg=${thm_gray}] #W "

# Inactive Window: Gray number, Dark background name
set-window-option -g window-status-format "#[fg=${thm_fg},bg=${thm_black4}] #I #[fg=${thm_fg},bg=${thm_black}] #W "

# Pane Borders
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_magenta}"

# Fix Command Line & Messages (Muted Colors)
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Mode Style (Selection color in copy mode)
set -g mode-style "bg=${thm_black4},fg=${thm_fg}"

# ==========================
# 4. PLUGINS
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
