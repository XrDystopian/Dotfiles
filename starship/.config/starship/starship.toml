"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$fill\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$conda\
$time\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = true
style = "fg:lavender"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = false
style_user = "fg:lavender"
style_root = "fg:lavender"
format = '[ $user]($style)'

[directory]
style = "fg:lavender"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Code" = "󰲋 "

[fill]
symbol = " "

[git_branch]
symbol = ""
format = '[[ $symbol $branch ](fg:yellow)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](fg:yellow)]($style)'

[nodejs]
symbol = ""
format = '[[ $symbol( $version) ](fg:green)]($style)'

[c]
symbol = " "
format = '[[ $symbol( $version) ](fg:blue)]($style)'

[rust]
symbol = ""
format = '[[ $symbol( $version) ](fg:red)]($style)'

[golang]
symbol = ""
format = '[[ $symbol( $version) ](fg:blue)]($style)'

[php]
symbol = ""
format = '[[ $symbol( $version) ](fg:pink)]($style)'

[java]
symbol = " "
format = '[[ $symbol( $version) ](fg:red)]($style)'

[lua]
symbol = ""
format = '[[ $symbol( $version) ](fg:blue)]($style)'

[kotlin]
symbol = ""
format = '[[ $symbol( $version) ](fg:mauve)]($style)'

[haskell]
symbol = ""
format = '[[ $symbol( $version) ](fg:sky)]($style)'

[python]
symbol = ""
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:green)]($style)'

[docker_context]
symbol = ""
format = '[[ $symbol( $context) ](fg:sapphire)]($style)'

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = true
time_format = "%R"
format = '[[  $time ](fg:pink)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:pink)'
vimcmd_replace_symbol = '[❮](bold fg:pink)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:pink"
disabled = false
show_notifications = true
min_time_to_notify = 45000

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
